[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcareplay-openai-agents"
version = "0.1.0"
description = "Record the OpenAI Agents SDK's own run structure — agents, handoffs, guardrails — into an OrcaReplay trace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["agents", "openai-agents", "tracing", "replay", "orcareplay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

# `agents` is not a dependency on purpose. This package is inert without it, and installing the SDK
# as a side effect of installing a debugging aid is the kind of thing that makes people uninstall
# the debugging aid.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "openai-agents>=0.20.0"]

[project.urls]
Homepage = "https://github.com/Continuum-AI-Corp/OrcaReplay"
Source = "https://github.com/Continuum-AI-Corp/OrcaReplay/tree/main/python-openai-agents"

[tool.setuptools]
packages = ["orcareplay_openai_agents"]
