name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npx tsc --build
      - run: npx vitest run --reporter=verbose

  conformance:
    name: trace format conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx tsc --build
      # Every example trace shipped in the repo must validate against the normative schema.
      # This is what makes the format a format rather than whatever the writer happens to emit.
      - run: node scripts/conformance.mjs
      # "Replay is reliable" as a number that regresses visibly rather than as a sentence. The
      # budgets live beside the corpus in the script; a change that costs fidelity fails here.
      - run: node scripts/fidelity.mjs --check

  integrations:
    name: framework integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx tsc --build
      # The frameworks this speaks for. A check whose package is missing is skipped rather than
      # failed, so a contributor can run the suite without all of them.
      - run: >
          pip install openai anthropic litellm langgraph langchain-openai browser-use
          crewai openai-agents openhands-sdk
      # `--require-all`, because installing them above was never what enforced it. Two checks were
      # added without a line here and CI stayed green on the skips, while the README said "in CI"
      # about both. A skip is now a failure on this runner, so forgetting the line above fails
      # loudly instead of quietly making a claim untrue.
      - run: node test/integrations/run.mjs --require-all

  python-sdk:
    name: python sdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # The SDK itself has no runtime dependencies and is meant to keep it that way, but the test
      # runner is not the SDK: setup-python provides a clean interpreter with no pytest on it.
      # Installing the package rather than running pytest against the source tree also checks that
      # `pip install orca-trace` actually works, which is how anyone will really get it.
      - run: pip install ./python[dev]
      - run: python -m pytest python/ -q

  plugin-api-neutrality:
    name: plugin API neutrality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # A vendor plugin must reach OrcaReplay only through the published interface.
      # If this ever fails, a plugin has grown a privileged path into the core.
      - run: node scripts/check-neutrality.mjs
