# `orcareplay-openai-agents` records the Agents SDK's own run structure — which agent a turn
# belonged to, that a handoff happened and from whom, whether a guardrail ran — into an OrcaReplay
# trace. It ships on its own tag for the same reason `orca-trace` does: a Python-only fix must not
# force a version bump across twelve npm packages, and the npm release must not fail because PyPI
# had a bad day.
#
# It is a *third* release workflow rather than another job in `release-python.yml` because the two
# Python packages are independent. They share a repository and nothing else: different sources,
# different versions, different reasons to cut a release. One tag that published both would make
# every `orca-trace` fix reissue this package, and PyPI does not allow reusing a version number.
#
# Publishing uses PyPI Trusted Publishing — GitHub's OIDC identity is exchanged for a short-lived
# upload token, so there is no PyPI secret in this repository to leak or rotate. It needs a
# one-time registration at pypi.org (Publishing -> Add a pending publisher) naming:
#
#   PyPI project   orcareplay-openai-agents
#   owner          Continuum-AI-Corp
#   repository     OrcaReplay
#   workflow       release-openai-agents.yml
#   environment    pypi
#
# Until that exists the upload step fails and nothing else is affected.
name: Release (orcareplay-openai-agents)

on:
  push:
    tags: ['agents-v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and check without uploading'
        type: boolean
        default: true

jobs:
  release-openai-agents:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: this is the whole credential
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A tag that disagrees with pyproject would publish a version nobody can reproduce from the
      # tree. Same check the other two releases make, for the same reason.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/agents-v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/agents-v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('python-openai-agents/pyproject.toml','rb'))['project']['version'])")
          [ "$tag" = "$pkg" ] || { echo "tag agents-v$tag does not match pyproject $pkg"; exit 1; }

      # The SDK is deliberately not a dependency — this package is inert without it, and installing
      # the SDK as a side effect of installing a debugging aid is the kind of thing that makes
      # people uninstall the debugging aid. So the tests need the `dev` extra, which brings it.
      - name: Test
        working-directory: python-openai-agents
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m pytest -q

      - name: Build
        working-directory: python-openai-agents
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-openai-agents/dist
