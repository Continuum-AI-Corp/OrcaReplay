[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orcareplay-langgraph"
version = "0.1.0"
description = "Record a LangGraph run's own structure — which node ran, in which superstep, and how it ended — into an OrcaReplay trace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["langgraph", "langchain", "tracing", "replay", "debugging", "orcareplay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
]

# Neither `langgraph` nor `langchain-core` is a dependency, on purpose. This package is inert
# without them, and installing a framework as a side effect of installing a debugging aid is the
# kind of thing that makes people uninstall the debugging aid. It is also what lets `orca record`
# leave the bootstrap in front of every Python process in a run: importing this costs nothing.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "langgraph>=0.2", "langchain-core>=0.3"]

[project.urls]
Homepage = "https://github.com/Continuum-AI-Corp/OrcaReplay"
Source = "https://github.com/Continuum-AI-Corp/OrcaReplay/tree/main/python-langgraph"

[tool.setuptools]
packages = ["orcareplay_langgraph"]
